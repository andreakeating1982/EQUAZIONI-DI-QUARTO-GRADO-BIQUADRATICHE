<!-- ============================================================
     EQUAZIONI DI QUARTO GRADO BIQUADRATICHE — CORNICE DINAMICA LITE (embed per Blogger)
     Font OpenDyslexic caricati dall'app (CORS abilitato su /fonts/*)
     Altezza dinamica: protocollo labvisivo:height
     ----------------------------------------
     Vantaggi: codice piccolo e leggibile, font sempre aggiornati.
     Richiede che l'app sia online (https://equazioni-biquadratiche.easy-peasy.site).
     Esiste anche la versione autosufficiente con font incorporati:
     embed-equazioni-biquadratiche.html (funziona anche se l'app è offline).
     ============================================================ -->
<style>
  @font-face {
    font-family: 'OpenDyslexic';
    src: url('https://equazioni-biquadratiche.easy-peasy.site/fonts/OpenDyslexic-Regular-v2.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'OpenDyslexic';
    src: url('https://equazioni-biquadratiche.easy-peasy.site/fonts/OpenDyslexic-Bold-v2.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  #eqEmbed {
    background: #faf7f2;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    font-family: 'OpenDyslexic', 'Cambria', 'Times New Roman', Georgia, serif;
    margin: 0 auto;
    max-width: 800px;
    overflow: hidden;
  }
  #eqEmbedHead {
    background: linear-gradient(135deg, #7c4a6b 0%, #b8846a 100%);
    padding: 14px 20px;
    text-align: center;
    border-bottom: 2px solid rgba(46,32,24,0.08);
  }
  #eqEmbedTitle {
    color: #ffffff;
    font-family: 'OpenDyslexic', 'Cambria', 'Times New Roman', Georgia, serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 0;
    line-height: 1.3;
  }
  #eqIframe {
    border: none;
    display: block;
    height: 600px;
    min-width: 100%;
    transition: height 0.25s ease;
    width: 1px;
  }
</style>

<div id="eqEmbed">
  <div id="eqEmbedHead">
    <div id="eqEmbedTitle">EQUAZIONI DI QUARTO GRADO BIQUADRATICHE</div>
  </div>
  <iframe id="eqIframe" loading="lazy" title="Equazioni biquadratiche — risolvi le equazioni di quarto grado in 7 passi" src="https://equazioni-biquadratiche.easy-peasy.site/"></iframe>
</div>

<script>
(function() {
  var iframe = document.getElementById('eqIframe');
  if (!iframe) return;
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'labvisivo:height' && typeof e.data.height === 'number') {
      if (e.data.height > 100) iframe.style.height = e.data.height + 'px';
    }
  });
  // Se l'app è già caricata prima che il listener parta, richiedi l'altezza
  setTimeout(function() {
    try { if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'labvisivo:ping' }, '*'); } catch (err) {}
  }, 800);
})();
</script>
